name: Eloquii
description: ELOQUII is a plus-size women's fashion retailer offering trend-driven,
  fashion-forward apparel and accessories in sizes 14 through 32, including dresses,
  workwear, outerwear, denim, and occasion wear with frequent seasonal collection
  refreshes. Known for its fit-obsessed design and inclusive sizing, the brand operates
  a direct-to-consumer ecommerce storefront at eloquii.com alongside select retail
  locations. ELOQUII was founded as a plus-size line, acquired by Walmart in 2018,
  and is now part of FullBeauty Brands. It was surfaced as a 500 Global portfolio
  company and added to the API Evangelist network; it publishes a consumer ecommerce
  experience but no public developer API surface at this time.
